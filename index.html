/* Image store: photos live in IndexedDB (hundreds of MB); localStorage keeps only short "idb:<id>" references. */
window.IM=(function(){
  var DB='printreg_images',ST='img',dbp=null,urls={},RX=/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+\/=]+/g,RR=/idb:h[0-9a-f]+_[0-9a-f]+/g;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      try{var r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){rej(r.error||new Error('idb'))};
        r.onblocked=function(){rej(new Error('blocked'))};
      }catch(e){rej(e)}
    });
    dbp.catch(function(){dbp=null});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    return dbp;
  }
  function hash(s){var a=2166136261,b=5381;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a^=c;a=Math.imul(a,16777619);b=(Math.imul(b,33)+c)|0}return 'h'+(a>>>0).toString(16)+(b>>>0).toString(16)+'_'+s.length.toString(16)}
  function toBlob(d){var i=d.indexOf(','),mime=d.slice(5,d.indexOf(';')),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
  function toData(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(b)})}
  function put(id,blob){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(ST,'readwrite');t.objectStore(ST).put(blob,id);t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error||new Error('put'))}})})}
  function getBlob(id){return open().then(function(db){return new Promise(function(res,rej){var q=db.transaction(ST,'readonly').objectStore(ST).get(id);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){rej(q.error)}})})}
  var IM={
    isRef:function(v){return typeof v==='string'&&v.indexOf('idb:')===0},
    /* data URL -> "idb:id" (falls back to returning the data URL if IndexedDB is unavailable) */
    ref:function(v){
      if(typeof v!=='string'||v.indexOf('data:image')!==0)return Promise.resolve(v||'');
      var id;try{id=hash(v);return put(id,toBlob(v)).then(function(){return 'idb:'+id},function(){return v})}catch(e){return Promise.resolve(v)}
    },
    blobURL:function(ref){
      if(!IM.isRef(ref))return Promise.resolve(ref||'');
      if(urls[ref])return Promise.resolve(urls[ref]);
      return getBlob(ref.slice(4)).then(function(b){if(!b)return '';return urls[ref]=URL.createObjectURL(b)},function(){return ''});
    },
    dataURL:function(ref){
      if(!IM.isRef(ref))return Promise.resolve(ref||'');
      return getBlob(ref.slice(4)).then(function(b){return b?toData(b):''},function(){return ''});
    },
    /* make <img src="idb:..."> work anywhere in a document */
    watch:function(doc){
      function fix(img){try{img.decoding='async'}catch(e){}var r=img.getAttribute('src');if(!IM.isRef(r))return;
        if(urls[r]){img.src=urls[r];return}
        IM.blobURL(r).then(function(u){if(u&&img.getAttribute('src')===r)img.src=u})}
      function scan(n){if(n.nodeType!==1)return;if(n.tagName==='IMG')fix(n);if(n.querySelectorAll)n.querySelectorAll('img[src^="idb:"]').forEach(fix)}
      try{
        new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(scan)})})
          .observe(doc.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
        doc.addEventListener('DOMContentLoaded',function(){scan(doc.documentElement)});
        scan(doc.documentElement);
      }catch(e){}
    },
    /* text containing data URLs -> same text with idb: references */
    externalize:function(str){
      if(typeof str!=='string'||str.indexOf('data:image')<0)return Promise.resolve(str);
      var found=str.match(RX)||[],map={};
      var uniq=found.filter(function(x,i){return found.indexOf(x)===i});
      return Promise.all(uniq.map(function(d){return IM.ref(d).then(function(r){map[d]=r})})).then(function(){
        return str.replace(RX,function(d){return map[d]||d})});
    },
    /* text containing idb: references -> text with real data URLs (for backups) */
    inline:function(str){
      if(typeof str!=='string'||str.indexOf('idb:h')<0)return Promise.resolve(str);
      var found=str.match(RR)||[],map={};
      var uniq=found.filter(function(x,i){return found.indexOf(x)===i});
      return Promise.all(uniq.map(function(r){return IM.dataURL(r).then(function(d){map[r]=d})})).then(function(){
        return str.replace(RR,function(r){return map[r]||''})});
    },
    /* one-time move of photos already sitting in localStorage into IndexedDB; resolves to number of keys changed */
    migrate:function(){
      var keys=[];for(var i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));
      var changed=0;
      return open().then(function(){
        return keys.reduce(function(p,k){return p.then(function(){
          var raw;try{raw=localStorage.getItem(k)}catch(e){return}
          if(!raw||raw.indexOf('data:image')<0)return;
          return IM.externalize(raw).then(function(nw){
            if(nw===raw||nw.indexOf('data:image')>=0&&nw.length>=raw.length)return;
            try{if(localStorage.getItem(k)===raw){localStorage.setItem(k,nw);changed++}}catch(e){}
          });
        })},Promise.resolve());
      }).then(function(){return changed},function(){return 0});
    }
  };
  return IM;
})();

<script>
(function(){
var K='pr_auth_v1',lk=document.getElementById('lk'),$=function(i){return document.getElementById(i)};
function open_(){lk.style.display='none'}
if(sessionStorage.getItem('pr_ok')==='1'){open_();return}
function h(t){var b=new TextEncoder().encode(t);return(window.crypto&&crypto.subtle?crypto.subtle.digest('SHA-256',b).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}):Promise.resolve(btoa(unescape(encodeURIComponent(t)))))}
var saved=null;try{saved=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
var setup=!saved;
$('lkt').textContent=setup?'First time: create your username and password':'Please log in';
$('lkb').textContent=setup?'Create login':'Log in';
$('lkc').style.display=setup?'block':'none';
$('lkp').autocomplete=setup?'new-password':'current-password';
function go(){
 var u=$('lku').value.trim(),p=$('lkp').value,e=$('lke');e.textContent='';
 if(!u||!p){e.textContent='Enter username and password';return}
 if(setup){
  if(p.length<4){e.textContent='Password must be at least 4 characters';return}
  if(p!==$('lkc').value){e.textContent='Passwords do not match';return}
  h(u.toLowerCase()+'|'+p).then(function(x){try{localStorage.setItem(K,JSON.stringify({h:x}))}catch(_){}sessionStorage.setItem('pr_ok','1');open_()})
 }else{
  h(u.toLowerCase()+'|'+p).then(function(x){if(x===saved.h){sessionStorage.setItem('pr_ok','1');open_()}else{e.textContent='Wrong username or password'}})
 }
}
$('lkb').onclick=go;
[$('lku'),$('lkp'),$('lkc')].forEach(function(i){i.addEventListener('keydown',function(ev){if(ev.key==='Enter')go()})});
})();

&lt;script&gt;
const colorRows = document.getElementById(&#x27;colorRows&#x27;);
const resultBox = document.getElementById(&#x27;resultBox&#x27;);
let rowId = 0;

function addRow(name=&#x27;&#x27;, meters=&#x27;&#x27;){
  const id = rowId++;
  const row = document.createElement(&#x27;div&#x27;);
  row.className = &#x27;row&#x27;;
  row.dataset.id = id;
  row.innerHTML = `
    &lt;div class=&quot;grow&quot;&gt;
      &lt;label&gt;Colour&lt;/label&gt;
      &lt;input type=&quot;text&quot; class=&quot;colorName&quot; placeholder=&quot;e.g. RC Black&quot;&gt;
    &lt;/div&gt;
    &lt;div class=&quot;small&quot;&gt;
      &lt;label&gt;Meters&lt;/label&gt;
      &lt;input type=&quot;number&quot; class=&quot;colorMeters&quot; min=&quot;0&quot;&gt;
    &lt;/div&gt;
    &lt;button class=&quot;btn-remove&quot; aria-label=&quot;Remove&quot;&gt;✕&lt;/button&gt;
  `;
  row.querySelector(&#x27;.colorName&#x27;).value = name;
  row.querySelector(&#x27;.colorMeters&#x27;).value = meters;
  row.querySelector(&#x27;.btn-remove&#x27;).onclick = () =&gt; { row.remove(); calculate(); };
  row.querySelectorAll(&#x27;input&#x27;).forEach(inp =&gt; inp.addEventListener(&#x27;input&#x27;, calculate));
  colorRows.appendChild(row);
}

document.getElementById(&#x27;addRowBtn&#x27;).onclick = () =&gt; addRow();
document.getElementById(&#x27;linesCount&#x27;).addEventListener(&#x27;input&#x27;, calculate);
document.getElementById(&#x27;mtrsPerShift&#x27;).addEventListener(&#x27;input&#x27;, calculate);
document.getElementById(&#x27;minSegment&#x27;).addEventListener(&#x27;input&#x27;, calculate);
document.getElementById(&#x27;frameNo&#x27;).addEventListener(&#x27;input&#x27;, calculate);
document.getElementById(&#x27;frameName&#x27;).addEventListener(&#x27;input&#x27;, calculate);
document.getElementById(&#x27;workDate&#x27;).addEventListener(&#x27;input&#x27;, calculate);

// Default the date to today, formatted for the date input (YYYY-MM-DD)
(function setDefaultDate(){
  const d = new Date();
  const pad = n =&gt; String(n).padStart(2, &#x27;0&#x27;);
  document.getElementById(&#x27;workDate&#x27;).value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
})();

function formatDateDisplay(isoStr){
  if (!isoStr) return &#x27;&#x27;;
  const [y, m, d] = isoStr.split(&#x27;-&#x27;);
  if (!y || !m || !d) return isoStr;
  return `${d}/${m}/${y}`;
}

var blockImageData = &#x27;&#x27;;
var _dTok = 0, _bTok = 0;
const IMref = async d =&gt; { try { return parent.IM ? await parent.IM.ref(d) : d; } catch(e){ return d; } };
const IMdata = async r =&gt; { try { return parent.IM ? await parent.IM.dataURL(r) : &#x27;&#x27;; } catch(e){ return &#x27;&#x27;; } };
let designImageData = &#x27;&#x27;;
const designImageUrl = document.getElementById(&#x27;designImageUrl&#x27;);
const designImageOverlay = document.getElementById(&#x27;designImageOverlay&#x27;);
const designImageClear = document.getElementById(&#x27;designImageClear&#x27;);
const imageModal = document.getElementById(&#x27;imageModal&#x27;);
const imageModalImg = document.getElementById(&#x27;imageModalImg&#x27;);

function setDesignImage(url){
  if (typeof url === &#x27;string&#x27; &amp;&amp; url.indexOf(&#x27;idb:&#x27;) === 0){
    const tk = ++_dTok; designImageData = &#x27;&#x27;;
    IMdata(url).then(d =&gt; { if (tk === _dTok) setDesignImage(d || &#x27;&#x27;); });
    return;
  }
  _dTok++;
  designImageData = url;
  if (url) {
    designImageUrl.style.backgroundImage = `url(${url})`;
    designImageUrl.placeholder = &#x27;&#x27;;
    designImageOverlay.style.display = &#x27;block&#x27;;
    designImageOverlay.style.cursor = &#x27;pointer&#x27;;
    designImageClear.style.display = &#x27;block&#x27;;
  } else {
    designImageUrl.style.backgroundImage = &#x27;none&#x27;;
    designImageUrl.placeholder = &#x27;+ Long-press → Paste a copied photo&#x27;;
    designImageOverlay.style.display = &#x27;none&#x27;;
    designImageClear.style.display = &#x27;none&#x27;;
  }
  calculate();
}

function openDesignImageModal(){
  if (!designImageData) return;
  imageModalImg.src = designImageData;
  imageModal.style.display = &#x27;flex&#x27;;
}
imageModal.addEventListener(&#x27;click&#x27;, () =&gt; { imageModal.style.display = &#x27;none&#x27;; });
designImageOverlay.addEventListener(&#x27;click&#x27;, openDesignImageModal);
designImageClear.addEventListener(&#x27;click&#x27;, (e) =&gt; {
  e.stopPropagation();
  designImageUrl.value = &#x27;&#x27;;
  setDesignImage(&#x27;&#x27;);
});

// Pasting an actual photo (from Share &gt; Copy / long-press &gt; Copy on a phone,
// or Ctrl+V of a copied image on desktop) lands here as clipboard file data —
// read it directly instead of treating it as typed text.
designImageUrl.addEventListener(&#x27;paste&#x27;, (e) =&gt; {
  const items = (e.clipboardData &amp;&amp; e.clipboardData.items) || [];
  for (const item of items) {
    if (item.type &amp;&amp; item.type.startsWith(&#x27;image/&#x27;)) {
      e.preventDefault();
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = () =&gt; {
        designImageUrl.value = &#x27;&#x27;;
        setDesignImage(reader.result);
      };
      reader.readAsDataURL(file);
      return;
    }
  }
  // otherwise let the normal text/URL paste happen, handled by the input listener below
});

designImageUrl.addEventListener(&#x27;input&#x27;, () =&gt; {
  setDesignImage(designImageUrl.value.trim());
});

// Device file picker — works reliably when this file is opened directly
// (offline / downloaded), unlike inside the hosted artifact&#x27;s sandbox.
const designImageFile = document.getElementById(&#x27;designImageFile&#x27;);
const designImageChooseBtn = document.getElementById(&#x27;designImageChooseBtn&#x27;);
designImageChooseBtn.addEventListener(&#x27;click&#x27;, () =&gt; designImageFile.click());
designImageFile.addEventListener(&#x27;change&#x27;, (e) =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () =&gt; setDesignImage(reader.result);
  reader.readAsDataURL(file);
});

function roundToHalf(n){
  return Math.round(n * 2) / 2;
}

function ceilToHalf(n){
  return Math.ceil(n * 2) / 2;
}

function calculate(){
  const lines = parseFloat(document.getElementById(&#x27;linesCount&#x27;).value) || 9;
  const mtrsPerShift = parseFloat(document.getElementById(&#x27;mtrsPerShift&#x27;).value) || 10;
  const colorsInput = [...colorRows.children].map(row =&gt; ({
    name: row.querySelector(&#x27;.colorName&#x27;).value.trim() || &#x27;Unnamed&#x27;,
    meters: parseFloat(row.querySelector(&#x27;.colorMeters&#x27;).value) || 0
  })).filter(c =&gt; c.meters &gt; 0);

  if (colorsInput.length === 0){
    resultBox.innerHTML = `&lt;p class=&quot;sub&quot; style=&quot;margin:0;&quot;&gt;Add at least one colour with meters to see the shift split.&lt;/p&gt;`;
    return;
  }

  const totalMeters = colorsInput.reduce((s,c) =&gt; s + c.meters, 0);
  const S = ceilToHalf(totalMeters / (lines * mtrsPerShift)); // shift-duration every line runs
  const MIN = parseFloat(document.getElementById(&#x27;minSegment&#x27;).value) || 0;

  // Sort colours largest-first, then pour them into lines one bucket (=S shifts) at a time,
  // splitting a colour across the boundary when it doesn&#x27;t fill a line exactly —
  // same pattern as the ledger (full dedicated lines for big colours, shared lines for leftovers).
  // A segment is never allowed to land below MIN shifts: if there isn&#x27;t room left in the
  // line for a proper MIN-sized segment, the leftover capacity is folded into the previous
  // segment instead (a small bonus run) rather than creating an unworkable sliver.
  const EPS = 1e-6;
  const queue = colorsInput.map(c =&gt; ({ name: c.name, remaining: c.meters / mtrsPerShift }))
                            .sort((a,b) =&gt; b.remaining - a.remaining);

  const allLines = [];
  let current = [];
  let capLeft = S;
  let idx = 0;
  let guard = 0;
  const guardMax = (queue.length + lines) * 20 + 50;

  while (idx &lt; queue.length &amp;&amp; guard &lt; guardMax){
    guard++;
    const color = queue[idx];
    if (color.remaining &lt;= EPS){ idx++; continue; }

    // Not enough room left in this line for a valid minimum segment: fold the
    // leftover into whatever&#x27;s already on this line and start a fresh line
    // for the current colour instead of creating a sub-minimum sliver.
    if (capLeft &lt; MIN - EPS &amp;&amp; capLeft &gt; EPS){
      if (current.length &gt; 0){
        current[current.length - 1].shift += capLeft;
      }
      allLines.push({ segs: current, idle: current.length === 0 ? capLeft : 0 });
      current = [];
      capLeft = S;
      continue;
    }

    let take = Math.min(color.remaining, capLeft);
    // If this would be a sub-minimum segment (colour&#x27;s leftover need is tiny),
    // round it up to MIN — a small planned bonus rather than an unworkable sliver.
    if (take &lt; MIN - EPS &amp;&amp; capLeft &gt;= MIN - EPS){
      take = Math.min(MIN, capLeft);
    }

    current.push({ name: color.name, shift: take });
    color.remaining = Math.max(0, color.remaining - take);
    capLeft -= take;

    if (capLeft &lt;= EPS){
      allLines.push({ segs: current, idle: 0 });
      current = [];
      capLeft = S;
    }
    if (color.remaining &lt;= EPS) idx++;
  }
  if (current.length &gt; 0){
    allLines.push({ segs: current, idle: 0 });
  }

  // If the last line was filled exactly, capLeft has reset to a full empty line —
  // that&#x27;s an unused line, not surplus to spread onto other segments.
  if (current.length === 0 &amp;&amp; capLeft &gt;= S - EPS) capLeft = 0;

  // Handle any leftover capacity from the final line (capLeft here is the
  // surplus: lines*S minus what colours actually needed).
  if (capLeft &gt; EPS){
    const LUMP_THRESHOLD = 3;
    const findLastSegment = (name) =&gt; {
      for (let li = allLines.length - 1; li &gt;= 0; li--){
        const segs = allLines[li].segs;
        for (let si = segs.length - 1; si &gt;= 0; si--){
          if (segs[si].name === name) return segs[si];
        }
      }
      return null;
    };
    if (capLeft &lt;= LUMP_THRESHOLD + EPS){
      // Small surplus: just add it to the very last segment placed.
      const lastLine = allLines[allLines.length - 1];
      if (lastLine &amp;&amp; lastLine.segs.length){
        lastLine.segs[lastLine.segs.length - 1].shift += capLeft;
      }
    } else {
      // Bigger surplus: spread it evenly across every colour instead of
      // dumping it all in one place.
      const names = colorsInput.map(c =&gt; c.name);
      const share = capLeft / names.length;
      names.forEach(nm =&gt; {
        const seg = findLastSegment(nm);
        if (seg) seg.shift += share;
      });
    }
  }

  // Shared lines: snap every segment to a half shift and make the line total exactly S
  // (e.g. 5.5 + 6, never 5.75 / 5.8 or a total longer than the line).
  allLines.forEach(line =&gt; {
    if (line.segs.length &lt; 2) return;
    const n = line.segs.length;
    let used = 0;
    for (let i = 0; i &lt; n - 1; i++){
      let v = roundToHalf(line.segs[i].shift);
      const maxV = S - used - MIN * (n - 1 - i);
      v = Math.max(Math.min(MIN, S), Math.min(v, Math.max(maxV, 0.5)));
      line.segs[i].shift = v;
      used += v;
    }
    line.segs[n - 1].shift = Math.max(0.5, S - used);
  });

  // Group solo (single-colour) lines together, list split lines individually
  const soloCount = {};
  const splitLines = [];
  allLines.forEach(line =&gt; {
    if (line.segs.length === 1){
      const nm = line.segs[0].name;
      soloCount[nm] = (soloCount[nm] || 0) + 1;
    } else {
      splitLines.push(line);
    }
  });

  const usedLines = allLines.length;
  const idleLines = lines - usedLines;
  const frameNo = document.getElementById(&#x27;frameNo&#x27;).value.trim();
  const frameName = document.getElementById(&#x27;frameName&#x27;).value.trim();
  const workDate = document.getElementById(&#x27;workDate&#x27;).value;
  const blockName = document.getElementById(&#x27;blockName&#x27;).value.trim();
  const orderNameParts = [];
  if (frameNo) orderNameParts.push(`Frame No: ${frameNo}`);
  if (frameName) orderNameParts.push(frameName);
  const orderName = orderNameParts.join(&#x27; — &#x27;);
  const dateDisplay = formatDateDisplay(workDate);
  const round1 = n =&gt; Math.round(n*10)/10;

  const soloRows = Object.keys(soloCount).map(nm =&gt; `
    &lt;tr&gt;
      &lt;td&gt;${nm}&lt;/td&gt;
      &lt;td&gt;${soloCount[nm]} line${soloCount[nm]===1?&#x27;&#x27;:&#x27;s&#x27;}&lt;/td&gt;
      &lt;td&gt;${round1(S)} shift&lt;/td&gt;
    &lt;/tr&gt;
  `).join(&#x27;&#x27;);

  const splitRows = splitLines.map((line, i) =&gt; `
    &lt;tr&gt;
      &lt;td colspan=&quot;3&quot; style=&quot;padding-top:${i===0?&#x27;4&#x27;:&#x27;12&#x27;}px;&quot;&gt;
        &lt;span class=&quot;sub&quot; style=&quot;font-size:0.72rem;&quot;&gt;Line ${usedLines - splitLines.length + i + 1}&lt;/span&gt;&lt;br&gt;
        ${line.segs.map(s =&gt; `${s.name} – ${round1(s.shift)} shift`).join(&#x27; &amp;nbsp;/&amp;nbsp; &#x27;)}
        ${line.idle &gt; 0.05 ? `&lt;span class=&quot;sub&quot;&gt; (idle ${round1(line.idle)} shift)&lt;/span&gt;` : &#x27;&#x27;}
      &lt;/td&gt;
    &lt;/tr&gt;
  `).join(&#x27;&#x27;);

  resultBox.innerHTML = `
    ${orderName || designImageData || dateDisplay ? `
    &lt;div class=&quot;sub&quot; style=&quot;margin-bottom:6px; display:flex; align-items:center; gap:8px;&quot;&gt;
      ${designImageData ? `&lt;img src=&quot;${designImageData}&quot; onclick=&quot;openDesignImageModal()&quot; style=&quot;width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;&quot;&gt;` : &#x27;&#x27;}
      &lt;span&gt;
        ${orderName ? `&lt;div style=&quot;font-weight:800; color:#000000;&quot;&gt;${orderName}&lt;/div&gt;` : &#x27;&#x27;}
        ${dateDisplay ? `&lt;div style=&quot;font-size:0.85rem; font-weight:700; color:#000000;&quot;&gt;Date: ${dateDisplay}&lt;/div&gt;` : &#x27;&#x27;}
      &lt;/span&gt;
    &lt;/div&gt;` : &#x27;&#x27;}
    ${(blockName || blockImageData) ? `
    &lt;div style=&quot;display:flex; align-items:center; gap:8px; margin-bottom:8px;&quot;&gt;
      ${blockImageData ? `&lt;img src=&quot;${blockImageData}&quot; style=&quot;width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line);&quot;&gt;` : &#x27;&#x27;}
      &lt;span style=&quot;font-size:0.85rem; font-weight:700; color:#000000;&quot;&gt;Colour block${blockName ? &#x27;: &#x27; + escHtml(blockName) : &#x27;&#x27;}&lt;/span&gt;
    &lt;/div&gt;` : &#x27;&#x27;}
    &lt;div&gt;Shift per line&lt;/div&gt;
    &lt;div class=&quot;total-shift&quot;&gt;${round1(S)} shift${S===1?&#x27;&#x27;:&#x27;s&#x27;}&lt;/div&gt;
    &lt;div class=&quot;sub&quot; style=&quot;margin-top:2px;&quot;&gt;${totalMeters}m total ÷ (${lines} lines × ${mtrsPerShift}m) — every line runs this long&lt;/div&gt;
    ${soloRows ? `
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Colour&lt;/th&gt;&lt;th&gt;Lines&lt;/th&gt;&lt;th&gt;Shift&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;${soloRows}&lt;/tbody&gt;
    &lt;/table&gt;` : &#x27;&#x27;}
    ${splitLines.length ? `
      &lt;div style=&quot;margin-top:16px; padding-top:10px; border-top:1px dashed var(--line);&quot;&gt;
        &lt;div class=&quot;sub&quot; style=&quot;text-transform:uppercase; font-size:0.72rem; letter-spacing:0.02em; margin-bottom:4px;&quot;&gt;Shared lines (split between colours)&lt;/div&gt;
        &lt;table&gt;&lt;tbody&gt;${splitRows}&lt;/tbody&gt;&lt;/table&gt;
      &lt;/div&gt;
    ` : &#x27;&#x27;}
    ${idleLines &gt; 0 ? `&lt;div class=&quot;sub&quot; style=&quot;margin-top:10px;&quot;&gt;${idleLines} line${idleLines===1?&#x27;&#x27;:&#x27;s&#x27;} unused.&lt;/div&gt;` : &#x27;&#x27;}
  `;
}

const STORE_KEY = &#x27;frameShiftSaved_v1&#x27;;
const savedList = document.getElementById(&#x27;savedList&#x27;);
const savedSearch = document.getElementById(&#x27;savedSearch&#x27;);

function loadAllSaved(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e){ return []; }
}
function persistSaved(list){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; } catch(e){ return false; }
}
function escHtml(t){
  return String(t).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
}
// Shrink the design photo so many calculations fit in device storage
function compressImage(dataUrl){
  return new Promise(resolve =&gt; {
    if (!dataUrl || !dataUrl.startsWith(&#x27;data:image&#x27;)) return resolve(dataUrl || &#x27;&#x27;);
    const img = new Image();
    img.onload = () =&gt; {
      const max = 700;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement(&#x27;canvas&#x27;);
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext(&#x27;2d&#x27;);
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(&#x27;image/jpeg&#x27;, 0.7));
    };
    img.onerror = () =&gt; resolve(dataUrl);
    img.src = dataUrl;
  });
}

        &lt;div style=&quot;display:flex; align-items:center; gap:6px; margin-top:4px;&quot;&gt;&lt;span class=&quot;sub&quot; style=&quot;font-size:0.75rem;&quot;&gt;📅&lt;/span&gt;&lt;input type=&quot;date&quot; data-date=&quot;${r.id}&quot; value=&quot;${escHtml(r.workDate || &#x27;&#x27;)}&quot; style=&quot;flex:1; min-width:0; padding:5px 6px; font-size:0.85rem; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink);&quot;&gt;&lt;/div&gt;

}

  let calcImage = &#x27;&#x27;;
  try { calcImage = (await renderCalcImage()).toDataURL(&#x27;image/jpeg&#x27;, 0.88); } catch(e){ calcImage = &#x27;&#x27;; }

  const rec = {
    id, frameName, frameNo,
    workDate: document.getElementById(&#x27;workDate&#x27;).value,
    blockName: blockNameInp.value.trim(),
    blockImage: await IMref(await compressImage(blockImageData)),
    lines: document.getElementById(&#x27;linesCount&#x27;).value,
    mtrs: document.getElementById(&#x27;mtrsPerShift&#x27;).value,

    image: await IMref(await compressImage(designImageData)),

  };
  if (existing &gt;= 0) all[existing] = rec; else all.push(rec);
  if (persistSaved(all)){
    savedSearch.value = &#x27;&#x27;;
    renderSaved();
    const btn = document.getElementById(&#x27;saveCalcBtn&#x27;);
    const old = btn.textContent;

    setTimeout(() =&gt; btn.textContent = old, 1500);
  } else {
    alert(&#x27;Could not save — device storage is full or blocked. Try deleting old saved calculations.&#x27;);

});

// --- Save calculation as image ---
async function renderCalcImage(){
  calculate(); // make sure resultBox reflects the latest inputs

  // Build an off-screen export card: same result content, but with the
  // design image shown full-size instead of the small inline thumbnail.
  const exportCard = document.createElement(&#x27;div&#x27;);
  exportCard.style.cssText = &#x27;position:fixed; left:-9999px; top:0; width:420px; background:#ffffff; color:#1f2937; padding:20px; font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;&#x27;;
  exportCard.innerHTML = resultBox.innerHTML;

  // Remove the small inline thumbnail from the cloned header (it duplicates
  // the full-size image we add below) and pull the frame no/name text out.
  const inlineImg = exportCard.querySelector(&#x27;img[onclick]&#x27;);
  let headerHTML = &#x27;&#x27;;
  if (inlineImg) {
    const headerRow = inlineImg.closest(&#x27;div&#x27;);
    const span = headerRow ? headerRow.querySelector(&#x27;span&#x27;) : null;
    headerHTML = span ? span.innerHTML : &#x27;&#x27;;
    headerRow.remove();
  }

  if (designImageData) {
    const bigImg = document.createElement(&#x27;img&#x27;);
    bigImg.src = designImageData;
    bigImg.style.cssText = &#x27;display:block; width:100%; max-height:260px; object-fit:contain; background:#fff; border:1px solid #e5e0d6; border-radius:8px; margin-bottom:10px;&#x27;;
    exportCard.insertBefore(bigImg, exportCard.firstChild);
  }
  if (headerHTML) {
    const headerDiv = document.createElement(&#x27;div&#x27;);
    headerDiv.innerHTML = headerHTML;
    headerDiv.style.cssText = &#x27;font-size:0.95rem; margin-bottom:8px; color:#1f2937;&#x27;;
    exportCard.insertBefore(headerDiv, exportCard.firstChild);
  }

  document.body.appendChild(exportCard);
  try {
    const canvas = await html2canvas(exportCard, { backgroundColor: &#x27;#ffffff&#x27;, scale: 2 });
    return canvas;
  } finally {
    exportCard.remove();
  }
}

document.getElementById(&#x27;saveImageBtn&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
  try {
    const canvas = await renderCalcImage();
    const dataUrl = canvas.toDataURL(&#x27;image/png&#x27;);
    const nm = document.getElementById(&#x27;frameName&#x27;).value.trim();
    const no = document.getElementById(&#x27;frameNo&#x27;).value.trim();
    const clean = t =&gt; t.replace(/[\\\/:*?&quot;&lt;&gt;|]+/g, &#x27;&#x27;).replace(/\s+/g, &#x27;_&#x27;);
    const base = clean([nm, no ? &#x27;No-&#x27; + no : &#x27;&#x27;].filter(Boolean).join(&#x27; &#x27;));
    const filename = (base || &#x27;frame-calculation&#x27;) + &#x27;.png&#x27;;
    const ALBUM = &#x27;SHIFT Calculator&#x27;;

    let saved = false;
    try {
      if (window.claude &amp;&amp; typeof window.claude.use === &#x27;function&#x27;) {
        const downloads = await window.claude.use(&#x27;downloads&#x27;);
        if (downloads) {
          await downloads.save({ filename, data: dataUrl });
          saved = true;
        }
      }
    } catch (err) { /* fall through to anchor download */ }

    try {
      const B = window.Android || (window.parent &amp;&amp; window.parent.Android);
      if (!saved &amp;&amp; B) {
        try { B.saveImage(dataUrl, filename, ALBUM); saved = true; }
        catch(e1) { B.saveImage(dataUrl, filename); saved = true; }
      }
    } catch(e){}
    if (!saved) {
      const a = document.createElement(&#x27;a&#x27;);
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  } catch (err) {
    alert(&#x27;Could not generate the image: &#x27; + err.message);
  }
});

// ---- Order queue -&gt; Frame Shift (auto load, calculate, save under frame name) ----
const queuePick = document.getElementById(&#x27;queuePick&#x27;);
const queueMsg = document.getElementById(&#x27;queueMsg&#x27;);
function readQueue(){
  try { const P = JSON.parse(localStorage.getItem(&#x27;planner_v1&#x27;)) || {}; return { orders: P.orders || [], S: P }; }
  catch(e){ return { orders: [], S: {} }; }
}
function refreshQueuePick(){
  const { orders } = readQueue();
  const cur = queuePick.value;
  queuePick.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;— Pick an order from queue (&#x27; + orders.length + &#x27;) —&lt;/option&gt;&#x27; +
    orders.map(o =&gt; {
      const tot = (o.cols || []).reduce((a,c) =&gt; a + (+c.m || 0), 0);
      return &#x27;&lt;option value=&quot;&#x27; + escHtml(String(o.id)) + &#x27;&quot;&gt;&#x27; + (o.fno ? &#x27;No.&#x27; + escHtml(o.fno) + &#x27; &#x27; : &#x27;&#x27;) + escHtml(o.cust) + &#x27; · &#x27; + tot + &#x27; m&lt;/option&gt;&#x27;;
    }).join(&#x27;&#x27;);
  if (cur) queuePick.value = cur;
}
function fillFromOrder(o, S){
  if (+S.lines &gt; 0) document.getElementById(&#x27;linesCount&#x27;).value = S.lines;
  if (+S.mps &gt; 0) document.getElementById(&#x27;mtrsPerShift&#x27;).value = S.mps;
  if (S.minseg !== undefined &amp;&amp; S.minseg !== null) document.getElementById(&#x27;minSegment&#x27;).value = S.minseg;
  const all = loadAllSaved();
  const nm = String(o.cust).trim().toLowerCase();
  const fno = (o.fno || &#x27;&#x27;).trim();
  const prev = all.find(x =&gt; x.frameName.trim().toLowerCase() === nm &amp;&amp; (!fno || (x.frameNo || &#x27;&#x27;) === fno))
            || all.find(x =&gt; x.frameName.trim().toLowerCase() === nm &amp;&amp; !x.frameNo);
  document.getElementById(&#x27;frameName&#x27;).value = o.cust;
  document.getElementById(&#x27;frameNo&#x27;).value = fno || (prev ? (prev.frameNo || &#x27;&#x27;) : &#x27;&#x27;);
  document.getElementById(&#x27;workDate&#x27;).value = prev ? (prev.workDate || &#x27;&#x27;) : document.getElementById(&#x27;workDate&#x27;).value;
  colorRows.innerHTML = &#x27;&#x27;;
  (o.cols || []).forEach(c =&gt; addRow(c.c, c.m));
  // print colour block: name from the order, image looked up from the saved colour blocks
  const blkName = (o.blk || &#x27;&#x27;).trim() || (prev ? (prev.blockName || &#x27;&#x27;) : &#x27;&#x27;);
  const blk = loadBlocks().find(b =&gt; (b.name || &#x27;&#x27;).toLowerCase() === blkName.toLowerCase());
  blockNameInp.value = blkName;
  blockImageUrl.value = &#x27;&#x27;;
  setBlockImage((blk &amp;&amp; blk.image) || (prev &amp;&amp; prev.blockName === blkName ? prev.blockImage : &#x27;&#x27;) || &#x27;&#x27;);
  renderBlockPick(blkName);
  designImageUrl.value = &#x27;&#x27;;
  setDesignImage(o.img || (prev ? prev.image : &#x27;&#x27;) || &#x27;&#x27;);
  calculate();
}
async function autoSaveCurrent(){
  const frameName = document.getElementById(&#x27;frameName&#x27;).value.trim();
  const frameNo = document.getElementById(&#x27;frameNo&#x27;).value.trim();
  if (!frameName) return false;
  const colors = [...colorRows.children].map(row =&gt; ({
    name: row.querySelector(&#x27;.colorName&#x27;).value.trim(),
    meters: row.querySelector(&#x27;.colorMeters&#x27;).value
  })).filter(c =&gt; c.name || c.meters);
  if (!colors.length) return false;
  const all = loadAllSaved();
  let i = all.findIndex(x =&gt; x.frameName.trim().toLowerCase() === frameName.toLowerCase() &amp;&amp; (x.frameNo || &#x27;&#x27;) === frameNo);
  const id = i &gt;= 0 ? all[i].id : (frameName + &#x27;|&#x27; + frameNo).toLowerCase();
  let calcImage = &#x27;&#x27;;
  try { calcImage = (await renderCalcImage()).toDataURL(&#x27;image/jpeg&#x27;, 0.88); } catch(e){}
  const rec = {
    id, frameName, frameNo,
    workDate: document.getElementById(&#x27;workDate&#x27;).value,
    blockName: blockNameInp.value.trim(),
    blockImage: await IMref(await compressImage(blockImageData)),
    lines: document.getElementById(&#x27;linesCount&#x27;).value,
    mtrs: document.getElementById(&#x27;mtrsPerShift&#x27;).value,
    minSeg: document.getElementById(&#x27;minSegment&#x27;).value,
    colors,
    image: await IMref(await compressImage(designImageData)),
    calcImage: await IMref(calcImage),
    savedAt: Date.now()
  };
  if (i &gt;= 0) all[i] = rec; else all.push(rec);
  const ok = persistSaved(all);
  if (ok){ savedSearch.value = &#x27;&#x27;; renderSaved(); }
  return ok;
}
document.getElementById(&#x27;queueLoadBtn&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
  const { orders, S } = readQueue();
  const o = orders.find(x =&gt; String(x.id) === queuePick.value);
  if (!o){ queueMsg.textContent = &#x27;Pick an order from the queue first.&#x27;; return; }
  fillFromOrder(o, S);
  const ok = await autoSaveCurrent();
  queueMsg.textContent = ok ? &#x27;✅ Calculated &amp; saved under “&#x27; + o.cust + &#x27;”.&#x27; : &#x27;⚠ Could not save (storage full?).&#x27;;
});
document.getElementById(&#x27;queueSyncBtn&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
  const { orders, S } = readQueue();
  if (!orders.length){ queueMsg.textContent = &#x27;Order queue is empty.&#x27;; return; }
  let n = 0;
  for (const o of orders){
    queueMsg.textContent = &#x27;⏳ &#x27; + (n + 1) + &#x27; / &#x27; + orders.length + &#x27; — &#x27; + o.cust;
    fillFromOrder(o, S);
    if (await autoSaveCurrent()) n++;
  }
  queueMsg.textContent = &#x27;✅ Synced &#x27; + n + &#x27; of &#x27; + orders.length + &#x27; orders into Saved calculations.&#x27;;
});

.fc{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:20px!important;padding:6px 12px;font-size:.78rem;font-weight:700}
.fc.on{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid #e6e9f2;border-radius:16px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.srow:active{transform:scale(.99)}
.srow .sl{min-width:0;flex:1}.srow .sl b{font-size:.98rem}
.mt{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:800;background:#eef1f7;color:#475569;border-radius:6px;padding:1px 6px;vertical-align:1px}
.pb{height:6px;border-radius:6px;background:#eef1f7;margin-top:7px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#fb7185);border-radius:6px}
.srow .sr{text-align:right;flex:none}.bv{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.bd{display:inline-block;font-size:.64rem;font-weight:800;border-radius:6px;padding:2px 6px;margin-top:3px}
.bd.neg{background:#fee2e2;color:#b91c1c}.bd.low{background:#fef3c7;color:#92400e}.bd.soon{background:#e0e7ff;color:#3730a3}.bd.dead{background:#f1f5f9;color:#475569}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #e6e9f2;border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.kpi small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;color:var(--sub);font-weight:700}.kpi b{display:block;font-size:1.35rem;margin-top:2px}
.kpi.bad b{color:#b91c1c}.kpi.ok b{color:#166534}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.82rem}.hb .n{flex:0 0 34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{flex:1;height:16px;background:#eef1f7;border-radius:8px;overflow:hidden}.hb .f{height:100%;background:linear-gradient(90deg,var(--acc),#fb7185)}.hb .v{flex:0 0 24%;text-align:right;font-weight:700}
#mdl{display:none;position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:50;align-items:flex-end;justify-content:center}
#mdl.on{display:flex}#mdlBox{background:#fff;width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#mdlBox h2{margin:0 0 4px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.lg{display:flex;justify-content:space-between;font-size:.82rem;padding:7px 0;border-bottom:1px solid var(--line)}.lg span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:.85rem}.act button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.act button.dng{color:#b91c1c;border-color:#fecaca}
.ed{border:0;background:none;font-size:1rem;padding:4px 6px}
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
  &lt;h1&gt;📋 Stock Register&lt;/h1&gt;
  &lt;p&gt;Received · Issued · Balance — by tape material &amp;amp; tape colour&lt;/p&gt;
&lt;/header&gt;
&lt;nav&gt;
  &lt;button class=&quot;tab-btn active&quot; data-tab=&quot;add&quot;&gt;Add Entry&lt;/button&gt;
  &lt;button class=&quot;tab-btn&quot; data-tab=&quot;balance&quot;&gt;Balance&lt;/button&gt;
  &lt;button class=&quot;tab-btn&quot; data-tab=&quot;log&quot;&gt;Log&lt;/button&gt;
  &lt;button class=&quot;tab-btn&quot; data-tab=&quot;match&quot;&gt;Match&lt;/button&gt;
  &lt;button class=&quot;tab-btn&quot; data-tab=&quot;insights&quot;&gt;Insights&lt;/button&gt;
&lt;/nav&gt;
&lt;main&gt;

&lt;section id=&quot;tab-add&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label&gt;Type&lt;/label&gt;
    &lt;div class=&quot;typebtns&quot;&gt;
      &lt;button type=&quot;button&quot; id=&quot;btnRecv&quot; class=&quot;selR active&quot;&gt;📥 Received&lt;/button&gt;
      &lt;button type=&quot;button&quot; id=&quot;btnIssue&quot; class=&quot;selI&quot;&gt;📤 Issued&lt;/button&gt;
    &lt;/div&gt;

    &lt;label&gt;Date&lt;/label&gt;
    &lt;input type=&quot;date&quot; id=&quot;fDate&quot;&gt;

    &lt;div&gt;
        &lt;label&gt;Tape Material&lt;/label&gt;
        &lt;div class=&quot;inpwrap&quot;&gt;
          &lt;input type=&quot;text&quot; id=&quot;fMaterial&quot; list=&quot;materialList&quot; placeholder=&quot;e.g. RC, HB&quot; autocomplete=&quot;off&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;addsmall&quot; id=&quot;addMaterialBtn&quot; title=&quot;Save to list&quot;&gt;＋&lt;/button&gt;
        &lt;/div&gt;
        &lt;datalist id=&quot;materialList&quot;&gt;&lt;/datalist&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;label&gt;Tape Colour&lt;/label&gt;
        &lt;div class=&quot;inpwrap&quot;&gt;
          &lt;input type=&quot;text&quot; id=&quot;fColor&quot; list=&quot;colorList&quot; placeholder=&quot;e.g. Black, Cream&quot; autocomplete=&quot;off&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;addsmall&quot; id=&quot;addColorBtn&quot; title=&quot;Save to list&quot;&gt;＋&lt;/button&gt;
        &lt;/div&gt;
        &lt;datalist id=&quot;colorList&quot;&gt;&lt;/datalist&gt;
      &lt;/div&gt;

    &lt;div class=&quot;row&quot;&gt;
      &lt;div&gt;
        &lt;label&gt;Roll count&lt;/label&gt;
        &lt;input type=&quot;number&quot; id=&quot;fCount&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0&quot;&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;label&gt;Length / roll (m)&lt;/label&gt;
        &lt;input type=&quot;number&quot; id=&quot;fLength&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0&quot;&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;cutWrap&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;Rolls cut from stock (only if you split big rolls)&lt;/label&gt;
    &lt;input type=&quot;number&quot; id=&quot;fCut&quot; inputmode=&quot;decimal&quot; placeholder=&quot;e.g. 5 big rolls cut into these&quot;&gt;&lt;/div&gt;
    &lt;label&gt;Supplier / Ref (optional)&lt;/label&gt;
    &lt;input type=&quot;text&quot; id=&quot;fNote&quot; placeholder=&quot;e.g. Challan 123, supplier name&quot; autocomplete=&quot;off&quot;&gt;

    &lt;button type=&quot;button&quot; class=&quot;tapebtn&quot; id=&quot;tapeAddBtn&quot;&gt;🧾 + Add line to tape&lt;/button&gt;
    &lt;div class=&quot;tape&quot; id=&quot;tapeBox&quot; style=&quot;display:none;&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;total&quot;&gt;Total: &lt;b id=&quot;fTotal&quot;&gt;0&lt;/b&gt; m &amp;nbsp;·&amp;nbsp; &lt;b id=&quot;fCountEcho&quot;&gt;0&lt;/b&gt; rolls&lt;/div&gt;

    &lt;button class=&quot;addbtn&quot; id=&quot;addEntryBtn&quot;&gt;Add entry&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;label style=&quot;margin-top:0;&quot;&gt;Saved tape materials&lt;/label&gt;
    &lt;div class=&quot;chiplist&quot; id=&quot;materialChips&quot;&gt;&lt;/div&gt;
    &lt;label&gt;Saved tape colours&lt;/label&gt;
    &lt;div class=&quot;chiplist&quot; id=&quot;colorChips&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;tab-balance&quot; style=&quot;display:none;&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;balSearch&quot; placeholder=&quot;Search tape material or colour...&quot;&gt;
    &lt;div class=&quot;chips&quot; id=&quot;balFilters&quot;&gt;&lt;button class=&quot;fc on&quot; data-f=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;fc&quot; data-f=&quot;low&quot;&gt;⚠ Low&lt;/button&gt;&lt;button class=&quot;fc&quot; data-f=&quot;neg&quot;&gt;Negative&lt;/button&gt;&lt;button class=&quot;fc&quot; data-f=&quot;soon&quot;&gt;Running out&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;&lt;div&gt;&lt;select id=&quot;balSort&quot;&gt;&lt;option value=&quot;name&quot;&gt;Sort: Name&lt;/option&gt;&lt;option value=&quot;high&quot;&gt;Balance: high → low&lt;/option&gt;&lt;option value=&quot;lowf&quot;&gt;Balance: low → high&lt;/option&gt;&lt;option value=&quot;days&quot;&gt;Days left: least first&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;act&quot;&gt;&lt;button id=&quot;balShare&quot; type=&quot;button&quot;&gt;📤 Share balance&lt;/button&gt;&lt;button id=&quot;balCsv&quot; type=&quot;button&quot;&gt;⬇ CSV&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;sumbox&quot; id=&quot;balSum&quot; style=&quot;margin:0 0 10px&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;balList&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;empty&quot; id=&quot;balEmpty&quot; style=&quot;display:none;&quot;&gt;No entries yet. Add one from the Add Entry tab.&lt;/div&gt;
  &lt;div class=&quot;s2&quot; style=&quot;text-align:center&quot;&gt;Tap any item to see its history, usage and set a minimum level.&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;tab-log&quot; style=&quot;display:none;&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;logSearch&quot; placeholder=&quot;Search material, colour, supplier / ref...&quot;&gt;
    &lt;div class=&quot;chips&quot; id=&quot;logFilters&quot;&gt;&lt;button class=&quot;fc on&quot; data-f=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;fc&quot; data-f=&quot;received&quot;&gt;📥 Received&lt;/button&gt;&lt;button class=&quot;fc&quot; data-f=&quot;issued&quot;&gt;📤 Issued&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;&lt;div&gt;&lt;select id=&quot;logMonth&quot;&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;s2&quot; id=&quot;logSum&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot; id=&quot;logCard&quot;&gt;
    &lt;div class=&quot;empty&quot; id=&quot;logEmpty&quot; style=&quot;display:none;&quot;&gt;No entries yet.&lt;/div&gt;
    &lt;div id=&quot;logList&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;tab-match&quot; style=&quot;display:none;&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;mh&quot;&gt;📦 Stock vs Order queue&lt;/div&gt;
    &lt;div class=&quot;s2&quot;&gt;Stock balance is compared with metres still to print in the Order Planner queue, by material and colour.&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;&lt;div&gt;&lt;label&gt;Wastage % (extra tape)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;wastePct&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Orders counted&lt;/label&gt;&lt;div class=&quot;total&quot; id=&quot;mqCount&quot; style=&quot;margin:0&quot;&gt;0&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sumbox&quot;&gt;&lt;div&gt;Short colours&lt;b id=&quot;sumShort&quot;&gt;0&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Tape to buy&lt;b id=&quot;sumBuy&quot;&gt;0 m&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Excess tape&lt;b id=&quot;sumEx&quot;&gt;0 m&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;mList&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;card mmap&quot; id=&quot;mUnm&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;tab-insights&quot; style=&quot;display:none;&quot;&gt;
  &lt;div id=&quot;insBody&quot;&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;div id=&quot;mdl&quot;&gt;&lt;div id=&quot;mdlBox&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
let entries = [];
try{
  const raw = localStorage.getItem(&#x27;stockregister_entries&#x27;);
  entries = raw ? JSON.parse(raw) : [];
}catch(e){ entries = []; }

let materials = [];
let colors = [];
try{ materials = JSON.parse(localStorage.getItem(&#x27;stockregister_materials&#x27;)) || []; }catch(e){ materials = []; }
try{ colors = JSON.parse(localStorage.getItem(&#x27;stockregister_colors&#x27;)) || []; }catch(e){ colors = []; }

function save(){
  try{ localStorage.setItem(&#x27;stockregister_entries&#x27;, JSON.stringify(entries)); }
  catch(e){ console.error(&#x27;save failed&#x27;, e); }
}
function saveLists(){
  try{
    localStorage.setItem(&#x27;stockregister_materials&#x27;, JSON.stringify(materials));
    localStorage.setItem(&#x27;stockregister_colors&#x27;, JSON.stringify(colors));
  }catch(e){ console.error(&#x27;save lists failed&#x27;, e); }
}
function addToList(list, value){
  const v = value.trim();
  if(!v) return false;
  const exists = list.some(x=&gt;x.toLowerCase()===v.toLowerCase());
  if(exists) return false;
  list.push(v);
  list.sort((a,b)=&gt;a.localeCompare(b));
  saveLists();
  return true;
}

// ---- tabs ----
document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(btn=&gt;{
  btn.addEventListener(&#x27;click&#x27;, ()=&gt;{
    document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
    btn.classList.add(&#x27;active&#x27;);
    [&#x27;add&#x27;,&#x27;balance&#x27;,&#x27;log&#x27;,&#x27;match&#x27;,&#x27;insights&#x27;].forEach(t=&gt;{
      document.getElementById(&#x27;tab-&#x27;+t).style.display = (t===btn.dataset.tab)?&#x27;&#x27;:&#x27;none&#x27;;
    });
    if(btn.dataset.tab===&#x27;balance&#x27;) renderBalance();
    if(btn.dataset.tab===&#x27;log&#x27;) renderLog();
    if(btn.dataset.tab===&#x27;match&#x27;) renderMatch();
    if(btn.dataset.tab===&#x27;insights&#x27;) renderInsights();
  });
});

// ---- add entry form ----
const fDate=document.getElementById(&#x27;fDate&#x27;);
fDate.value = new Date().toISOString().slice(0,10);
const fMaterial=document.getElementById(&#x27;fMaterial&#x27;);
const fColor=document.getElementById(&#x27;fColor&#x27;);
const fCount=document.getElementById(&#x27;fCount&#x27;);
const fLength=document.getElementById(&#x27;fLength&#x27;);
const fTotal=document.getElementById(&#x27;fTotal&#x27;);
const fCountEcho=document.getElementById(&#x27;fCountEcho&#x27;);
let type=&#x27;received&#x27;;
const btnRecv=document.getElementById(&#x27;btnRecv&#x27;), btnIssue=document.getElementById(&#x27;btnIssue&#x27;);
btnRecv.addEventListener(&#x27;click&#x27;,()=&gt;{type=&#x27;received&#x27;; btnRecv.classList.add(&#x27;active&#x27;); btnIssue.classList.remove(&#x27;active&#x27;);document.getElementById(&#x27;cutWrap&#x27;).style.display=&#x27;none&#x27;;});
btnIssue.addEventListener(&#x27;click&#x27;,()=&gt;{type=&#x27;issued&#x27;; btnIssue.classList.add(&#x27;active&#x27;); btnRecv.classList.remove(&#x27;active&#x27;);document.getElementById(&#x27;cutWrap&#x27;).style.display=&#x27;&#x27;;});

let tape=[];
function renderTape(){
  const box=document.getElementById(&#x27;tapeBox&#x27;);
  if(!tape.length){ box.style.display=&#x27;none&#x27;; box.innerHTML=&#x27;&#x27;; return; }
  box.style.display=&#x27;&#x27;;
  const sum=tape.reduce((a,t)=&gt;a+t.length*t.count,0);
  box.innerHTML = tape.map((t,i)=&gt;
    `&lt;div class=&quot;tl&quot;&gt;&lt;span&gt;${t.length} × ${t.count} = ${(t.length*t.count).toFixed(0)}&lt;/span&gt;&lt;button data-i=&quot;${i}&quot; title=&quot;Remove&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;`
  ).join(&#x27;&#x27;) + `&lt;div class=&quot;tsum&quot;&gt;${sum.toFixed(0)} m&lt;/div&gt;`;
  box.querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
    tape.splice(+b.dataset.i,1); renderTape(); updateTotal();
  }));
}
document.getElementById(&#x27;tapeAddBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  const c=parseFloat(fCount.value)||0, l=parseFloat(fLength.value)||0;
  if(c&lt;=0||l&lt;=0){ alert(&#x27;Enter roll count and length first.&#x27;); return; }
  tape.push({count:c,length:l});
  fCount.value=&#x27;&#x27;; fLength.value=&#x27;&#x27;;
  renderTape(); updateTotal();
  fLength.focus();
});
function updateTotal(){
  const c=parseFloat(fCount.value)||0, l=parseFloat(fLength.value)||0;
  const tm=tape.reduce((a,t)=&gt;a+t.length*t.count,0), tr=tape.reduce((a,t)=&gt;a+t.count,0);
  fTotal.textContent = (tm + c*l).toFixed(0);
  fCountEcho.textContent = tr + c;
}
fCount.addEventListener(&#x27;input&#x27;,updateTotal);
fLength.addEventListener(&#x27;input&#x27;,updateTotal);

document.getElementById(&#x27;addEntryBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  let material=fMaterial.value.trim();
  let color=fColor.value.trim();
  const _n=s=&gt;String(s||&#x27;&#x27;).trim().toLowerCase().replace(/\s+/g,&#x27; &#x27;);
  const _m=materials.find(x=&gt;_n(x)===_n(material)); if(_m) material=_m;
  const _c=colors.find(x=&gt;_n(x)===_n(color)); if(_c) color=_c;
  const count=parseFloat(fCount.value)||0;
  const length=parseFloat(fLength.value)||0;
  const lines=[...tape];
  if(count&gt;0&amp;&amp;length&gt;0) lines.push({count,length});
  if(!material||!color||!lines.length){
    alert(&#x27;Please fill tape material, tape colour, roll count and length.&#x27;);
    return;
  }
  const cutV=document.getElementById(&#x27;fCut&#x27;).value.trim();
  lines.forEach(t=&gt;{const en={
    id: Date.now()+Math.random().toString(16).slice(2),
    date: fDate.value || new Date().toISOString().slice(0,10),
    type, material, color, count:t.count, length:t.length, total: t.count*t.length, note:(document.getElementById(&#x27;fNote&#x27;).value||&#x27;&#x27;).trim()
  };if(type===&#x27;issued&#x27;&amp;&amp;lines.length===1&amp;&amp;cutV!==&#x27;&#x27;&amp;&amp;+cutV&gt;=0)en.rollsUsed=+cutV;entries.push(en)});
  document.getElementById(&#x27;fCut&#x27;).value=&#x27;&#x27;;
  tape=[]; renderTape();
  save();
  addToList(materials, material);
  addToList(colors, color);
  fMaterial.value=&#x27;&#x27;; fColor.value=&#x27;&#x27;; fCount.value=&#x27;&#x27;; fLength.value=&#x27;&#x27;; document.getElementById(&#x27;fNote&#x27;).value=&#x27;&#x27;;
  updateTotal();
  refreshDatalists();
  fMaterial.focus();
});

function refreshDatalists(){
  document.getElementById(&#x27;materialList&#x27;).innerHTML = materials.map(m=&gt;`&lt;option value=&quot;${escapeHtml(m)}&quot;&gt;`).join(&#x27;&#x27;);
  document.getElementById(&#x27;colorList&#x27;).innerHTML = colors.map(c=&gt;`&lt;option value=&quot;${escapeHtml(c)}&quot;&gt;`).join(&#x27;&#x27;);
  renderChips();
}

function renderChips(){
  const mWrap=document.getElementById(&#x27;materialChips&#x27;);
  const cWrap=document.getElementById(&#x27;colorChips&#x27;);
  mWrap.innerHTML = materials.length ? materials.map(m=&gt;
    `&lt;span class=&quot;chip&quot;&gt;${escapeHtml(m)}&lt;button data-kind=&quot;m&quot; data-val=&quot;${escapeHtml(m)}&quot;&gt;✕&lt;/button&gt;&lt;/span&gt;`
  ).join(&#x27;&#x27;) : &#x27;&lt;span class=&quot;chipempty&quot;&gt;None saved yet&lt;/span&gt;&#x27;;
  cWrap.innerHTML = colors.length ? colors.map(c=&gt;
    `&lt;span class=&quot;chip&quot;&gt;${escapeHtml(c)}&lt;button data-kind=&quot;c&quot; data-val=&quot;${escapeHtml(c)}&quot;&gt;✕&lt;/button&gt;&lt;/span&gt;`
  ).join(&#x27;&#x27;) : &#x27;&lt;span class=&quot;chipempty&quot;&gt;None saved yet&lt;/span&gt;&#x27;;
  document.querySelectorAll(&#x27;.chip button&#x27;).forEach(btn=&gt;{
    btn.addEventListener(&#x27;click&#x27;,()=&gt;{
      const val=btn.dataset.val;
      if(btn.dataset.confirming===&#x27;1&#x27;){
        if(btn.dataset.kind===&#x27;m&#x27;){
          materials = materials.filter(x=&gt;x!==val);
        } else {
          colors = colors.filter(x=&gt;x!==val);
        }
        saveLists();
        refreshDatalists();
      } else {
        document.querySelectorAll(&#x27;.chip button&#x27;).forEach(b=&gt;{b.dataset.confirming=&#x27;0&#x27;; b.textContent=&#x27;✕&#x27;;});
        btn.dataset.confirming=&#x27;1&#x27;;
        btn.textContent=&#x27;Tap to confirm&#x27;;

function computeBalance(){
  const map={};
  const nk=s=&gt;String(s||&#x27;&#x27;).trim().toLowerCase().replace(/\s+/g,&#x27; &#x27;);
  entries.forEach(e=&gt;{
    const key=nk(e.material)+&#x27;||&#x27;+nk(e.color);
    if(!map[key]) map[key]={material:String(e.material).trim(),color:String(e.color).trim(),recvM:0,issueM:0,recvR:0,issueR:0};
    else { if(!/[A-Z]/.test(map[key].color.charAt(0)) &amp;&amp; /[A-Z]/.test(String(e.color).trim().charAt(0))) map[key].color=String(e.color).trim(); }
    if(e.type===&#x27;received&#x27;){ map[key].recvM+=e.total; map[key].recvR+=e.count; }
    else { map[key].issueM+=e.total; map[key].issueR+=(e.rollsUsed!=null&amp;&amp;e.rollsUsed!==&#x27;&#x27;&amp;&amp;!isNaN(+e.rollsUsed)?+e.rollsUsed:e.count); }
  });
  return Object.values(map).sort((a,b)=&gt; (a.material+a.color).localeCompare(b.material+b.color));
}

function renderMatch(){
  const P=ldj(PLK,{orders:[]}), lines=+P.lines||9, mps=+P.mps||10, al=ldj(ALK,{});

    const cols=o.cols||[], tot=cols.reduce((a,c)=&gt;a+(+c.m||0),0);
    const sh=o.ovr||Math.ceil(tot/(lines*mps)*2-1e-9)/2;
    if(!sh) return;

    if(f&lt;=1e-9) return;
    counted++;
    cols.forEach(c=&gt;{
      const k0=nz(o.mat)+&#x27;|&#x27;+nz(c.c), sc=al[k0];

      if(!need[k]) need[k]={m:0,mat:o.mat,color:sc||c.c,orig:[]};
      need[k].m+=(+c.m||0)*f*w;
      if(!sc) need[k].orig.push({k0,mat:o.mat,color:c.c});

  });
  const stk={};
  computeBalance().forEach(r=&gt;{
    const k=nz(r.material)+&#x27;|&#x27;+nz(r.color);

    const nm=n?n.m:0, bal=s?s.bal:0, diff=bal-nm;
    rows.push({k, mat:s?s.mat:n.mat, color:s?s.color:n.color, bal, need:nm, diff, L:s?s.L:0, noStock:!s});
  });
  let shortN=0, buy=0, ex=0;
  rows.forEach(r=&gt;{ if(r.diff&lt;-0.5){shortN++; buy+=-r.diff;} else if(r.diff&gt;0.5) ex+=r.diff; });
  document.getElementById(&#x27;mqCount&#x27;).textContent=counted;
  document.getElementById(&#x27;sumShort&#x27;).textContent=shortN;
  document.getElementById(&#x27;sumBuy&#x27;).textContent=fmN(buy)+&#x27; m&#x27;;
  document.getElementById(&#x27;sumEx&#x27;).textContent=fmN(ex)+&#x27; m&#x27;;
  const byMat={};

  const list=document.getElementById(&#x27;mList&#x27;);
  if(!rows.length){ list.innerHTML=&#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;empty&quot;&gt;No stock entries and no orders in queue yet.&lt;/div&gt;&lt;/div&gt;&#x27;; }
  else list.innerHTML=Object.values(byMat).sort((a,b)=&gt;a.name.localeCompare(b.name)).map(g=&gt;{
    g.rows.sort((a,b)=&gt;a.diff-b.diff);
    return `&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;mh&quot;&gt;${escapeHtml(g.name)}&lt;/div&gt;`+g.rows.map(r=&gt;{
      const a=Math.abs(r.diff), rolls=r.L&gt;0?(r.diff&lt;0?Math.ceil(a/r.L-1e-9):Math.floor(a/r.L+1e-9)):0;
      let res;
      if(r.diff&lt;-0.5) res=`&lt;div class=&quot;mres bad&quot;&gt;Need ${fmN(a)} m&lt;small&gt;${r.L&gt;0?&#x27;≈ &#x27;+rolls+&#x27; roll&#x27;+(rolls==1?&#x27;&#x27;:&#x27;s&#x27;)+&#x27; of &#x27;+fmN(r.L)+&#x27; m&#x27;:&#x27;buy more&#x27;}&lt;/small&gt;&lt;/div&gt;`;
      else if(r.diff&gt;0.5) res=`&lt;div class=&quot;mres good&quot;&gt;Excess ${fmN(a)} m&lt;small&gt;${r.L&gt;0?&#x27;≈ &#x27;+rolls+&#x27; roll&#x27;+(rolls==1?&#x27;&#x27;:&#x27;s&#x27;)+&#x27; of &#x27;+fmN(r.L)+&#x27; m&#x27;:&#x27;left over&#x27;}&lt;/small&gt;&lt;/div&gt;`;
      else res=`&lt;div class=&quot;mres good&quot;&gt;Exact ✓&lt;/div&gt;`;
      return `&lt;div class=&quot;mrow&quot;&gt;&lt;div&gt;&lt;b&gt;${escapeHtml(r.color)}&lt;/b&gt;&lt;div class=&quot;s2&quot;&gt;Stock ${fmN(r.bal)} m · Queue needs ${fmN(r.need)} m${r.noStock?&#x27; · not in stock&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;${res}&lt;/div&gt;`;
    }).join(&#x27;&#x27;)+`&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
  const um=document.getElementById(&#x27;mUnm&#x27;);
  const seen={}, un=unmatched.filter(x=&gt;seen[x.k0]?false:(seen[x.k0]=1));

      un.map((x,i)=&gt;{
        const opts=Object.values(stk).filter(s=&gt;nz(s.mat)===nz(x.mat)).map(s=&gt;`&lt;option value=&quot;${escapeHtml(s.color)}&quot;&gt;${escapeHtml(s.color)}&lt;/option&gt;`).join(&#x27;&#x27;);

  openM(&#x27;&lt;h2&gt;&lt;span&gt;&#x27;+escapeHtml(r.color)+&#x27; &lt;span class=&quot;mt&quot;&gt;&#x27;+escapeHtml(r.material)+&#x27;&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;ed&quot; id=&quot;mx&quot;&gt;✕&lt;/button&gt;&lt;/h2&gt;&#x27;+
   &#x27;&lt;div class=&quot;kpis&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Balance&lt;/small&gt;&lt;b class=&quot;&#x27;+(r.neg?&#x27;balneg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+fmN(r.bal)+&#x27; m&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Rolls&lt;/small&gt;&lt;b&gt;&#x27;+r.balR+&#x27;&lt;/b&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;/div&gt;&#x27;+
   &#x27;&lt;label&gt;Minimum level (m) — alert when stock falls to this&lt;/label&gt;&lt;div class=&quot;inpwrap&quot;&gt;&lt;input type=&quot;number&quot; id=&quot;mMin&quot; inputmode=&quot;decimal&quot; value=&quot;&#x27;+(r.min||&#x27;&#x27;)+&#x27;&quot; placeholder=&quot;0 = no alert&quot;&gt;&lt;button class=&quot;fc on&quot; id=&quot;mMinSave&quot; type=&quot;button&quot; style=&quot;border-radius:9px!important&quot;&gt;Save&lt;/button&gt;&lt;/div&gt;&#x27;+

   (withRun.length?withRun.map(x=&gt;&#x27;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&#x27;+fmD(x.e.date)+&#x27; · &lt;span class=&quot;tag &#x27;+(x.e.type===&#x27;received&#x27;?&#x27;recv&#x27;:&#x27;issue&#x27;)+&#x27;&quot;&gt;&#x27;+(x.e.type===&#x27;received&#x27;?&#x27;RECV&#x27;:&#x27;ISSUE&#x27;)+&#x27;&lt;/span&gt;&#x27;+x.e.count+&#x27; × &#x27;+x.e.length+&#x27;m&#x27;+(x.e.note?&#x27; · &#x27;+escapeHtml(x.e.note):&#x27;&#x27;)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+(x.e.type===&#x27;received&#x27;?&#x27;+&#x27;:&#x27;−&#x27;)+fmN(x.e.total)+&#x27; → &#x27;+fmN(x.run)+&#x27; &lt;button class=&quot;ed&quot; data-hed=&quot;&#x27;+x.e.id+&#x27;&quot; type=&quot;button&quot; title=&quot;Edit&quot;&gt;✏️&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;empty&quot;&gt;No history.&lt;/div&gt;&#x27;));
  document.getElementById(&#x27;mx&#x27;).onclick=closeM;
  document.querySelectorAll(&#x27;[data-hed]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{closeM();openEdit(b.dataset.hed)});
  document.getElementById(&#x27;mMinSave&#x27;).onclick=()=&gt;{const mm=minMap(),v=parseFloat(document.getElementById(&#x27;mMin&#x27;).value)||0;if(v&gt;0)mm[k]=v;else delete mm[k];try{localStorage.setItem(MINK,JSON.stringify(mm))}catch(e){}closeM();renderBalance()};
  document.getElementById(&#x27;mQuick&#x27;).onclick=()=&gt;{closeM();document.querySelector(&#x27;[data-tab=add]&#x27;).click();fMaterial.value=r.material;fColor.value=r.color;fCount.focus();window.scrollTo(0,0)};
}

// ---- log ----
let logType=&#x27;all&#x27;;
function monthsOf(){return [...new Set(entries.map(e=&gt;e.date.slice(0,7)))].sort().reverse()}
function renderLog(){
  const sel=document.getElementById(&#x27;logMonth&#x27;),cur=sel.value;
  sel.innerHTML=&#x27;&lt;option value=&quot;&quot;&gt;All months&lt;/option&gt;&#x27;+monthsOf().map(m=&gt;&#x27;&lt;option value=&quot;&#x27;+m+&#x27;&quot;&gt;&#x27;+new Date(m+&#x27;-01T00:00&#x27;).toLocaleDateString(&#x27;en-GB&#x27;,{month:&#x27;long&#x27;,year:&#x27;numeric&#x27;})+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;);
  sel.value=monthsOf().includes(cur)?cur:&#x27;&#x27;;
  const q=(document.getElementById(&#x27;logSearch&#x27;).value||&#x27;&#x27;).toLowerCase(),mo=sel.value;
  const sorted=[...entries].filter(e=&gt;(logType===&#x27;all&#x27;||e.type===logType)&amp;&amp;(!mo||e.date.startsWith(mo))&amp;&amp;(e.material+&#x27; &#x27;+e.color+&#x27; &#x27;+(e.note||&#x27;&#x27;)).toLowerCase().includes(q)).sort((a,b)=&gt;b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const rc=sorted.filter(e=&gt;e.type===&#x27;received&#x27;).reduce((a,e)=&gt;a+e.total,0),is=sorted.filter(e=&gt;e.type===&#x27;issued&#x27;).reduce((a,e)=&gt;a+e.total,0);
  document.getElementById(&#x27;logSum&#x27;).innerHTML=sorted.length+&#x27; entr&#x27;+(sorted.length==1?&#x27;y&#x27;:&#x27;ies&#x27;)+&#x27; · 📥 &lt;b&gt;&#x27;+fmN(rc)+&#x27; m&lt;/b&gt; · 📤 &lt;b&gt;&#x27;+fmN(is)+&#x27; m&lt;/b&gt;&#x27;;
  document.getElementById(&#x27;logEmpty&#x27;).style.display=sorted.length?&#x27;none&#x27;:&#x27;&#x27;;
  document.getElementById(&#x27;logList&#x27;).innerHTML=sorted.map(e=&gt;{
    const tag=e.type===&#x27;received&#x27;?&#x27;&lt;span class=&quot;tag recv&quot;&gt;RECV&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;tag issue&quot;&gt;ISSUE&lt;/span&gt;&#x27;;
    return &#x27;&lt;div class=&quot;logitem&quot;&gt;&lt;div class=&quot;logleft&quot;&gt;&lt;div class=&quot;m&quot;&gt;&#x27;+tag+escapeHtml(e.material)+&#x27; — &#x27;+escapeHtml(e.color)+&#x27;&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;&#x27;+fmD(e.date)+&#x27; · &#x27;+e.count+&#x27; × &#x27;+e.length+&#x27;m&#x27;+(e.note?&#x27; · &#x27;+escapeHtml(e.note):&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;logright&quot;&gt;&#x27;+e.total.toFixed(0)+&#x27; m&lt;button class=&quot;ed&quot; data-ed=&quot;&#x27;+e.id+&#x27;&quot; title=&quot;Edit&quot;&gt;✏️&lt;/button&gt;&lt;button class=&quot;del&quot; data-id=&quot;&#x27;+e.id+&#x27;&quot; title=&quot;Delete&quot;&gt;🗑&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;}).join(&#x27;&#x27;);
}
document.getElementById(&#x27;logSearch&#x27;).addEventListener(&#x27;input&#x27;,renderLog);
document.getElementById(&#x27;logMonth&#x27;).addEventListener(&#x27;change&#x27;,renderLog);
document.getElementById(&#x27;logFilters&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{const f=e.target.dataset.f;if(!f)return;logType=f;[...e.currentTarget.children].forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,b.dataset.f===f));renderLog()});
document.getElementById(&#x27;logList&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{
  const del=e.target.closest(&#x27;[data-id]&#x27;),ed=e.target.closest(&#x27;[data-ed]&#x27;);
  if(del&amp;&amp;confirm(&#x27;Delete this entry?&#x27;)){entries=entries.filter(x=&gt;x.id!==del.dataset.id);save();renderLog()}
  if(ed)openEdit(ed.dataset.ed)});
function openEdit(id){
  const e=entries.find(x=&gt;x.id===id);if(!e)return;
  openM(&#x27;&lt;h2&gt;&lt;span&gt;✏️ Edit entry&lt;/span&gt;&lt;button class=&quot;ed&quot; id=&quot;mx&quot;&gt;✕&lt;/button&gt;&lt;/h2&gt;&#x27;+
   &#x27;&lt;label&gt;Type&lt;/label&gt;&lt;select id=&quot;eT&quot;&gt;&lt;option value=&quot;received&quot;&#x27;+(e.type===&#x27;received&#x27;?&#x27; selected&#x27;:&#x27;&#x27;)+&#x27;&gt;📥 Received&lt;/option&gt;&lt;option value=&quot;issued&quot;&#x27;+(e.type===&#x27;issued&#x27;?&#x27; selected&#x27;:&#x27;&#x27;)+&#x27;&gt;📤 Issued&lt;/option&gt;&lt;/select&gt;&#x27;+
   &#x27;&lt;label&gt;Date&lt;/label&gt;&lt;input type=&quot;date&quot; id=&quot;eD&quot; value=&quot;&#x27;+e.date+&#x27;&quot;&gt;&#x27;+
   &#x27;&lt;label&gt;Tape material&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;eM&quot; list=&quot;materialList&quot; value=&quot;&#x27;+escapeHtml(e.material)+&#x27;&quot;&gt;&#x27;+
   &#x27;&lt;label&gt;Tape colour&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;eC&quot; list=&quot;colorList&quot; value=&quot;&#x27;+escapeHtml(e.color)+&#x27;&quot;&gt;&#x27;+
   &#x27;&lt;div class=&quot;row&quot;&gt;&lt;div&gt;&lt;label&gt;Roll count&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;eN&quot; inputmode=&quot;decimal&quot; value=&quot;&#x27;+e.count+&#x27;&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Length / roll (m)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;eL&quot; inputmode=&quot;decimal&quot; value=&quot;&#x27;+e.length+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div id=&quot;eCutW&quot;&#x27;+(e.type===&#x27;issued&#x27;?&#x27;&#x27;:&#x27; style=&quot;display:none&quot;&#x27;)+&#x27;&gt;&lt;label&gt;Rolls cut from stock (only if you split big rolls)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;eCut&quot; inputmode=&quot;decimal&quot; placeholder=&quot;blank = same as roll count&quot; value=&quot;&#x27;+(e.rollsUsed!=null&amp;&amp;e.rollsUsed!==&#x27;&#x27;?e.rollsUsed:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;label&gt;Supplier / Ref&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;eR&quot; value=&quot;&#x27;+escapeHtml(e.note||&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+
   &#x27;&lt;div class=&quot;act&quot;&gt;&lt;button id=&quot;eDel&quot; class=&quot;dng&quot; type=&quot;button&quot;&gt;🗑 Delete&lt;/button&gt;&lt;button id=&quot;eSave&quot; class=&quot;pri&quot; type=&quot;button&quot;&gt;Save changes&lt;/button&gt;&lt;/div&gt;&#x27;);
  document.getElementById(&#x27;mx&#x27;).onclick=closeM;
  document.getElementById(&#x27;eT&#x27;).onchange=ev=&gt;{document.getElementById(&#x27;eCutW&#x27;).style.display=ev.target.value===&#x27;issued&#x27;?&#x27;&#x27;:&#x27;none&#x27;};
  document.getElementById(&#x27;eDel&#x27;).onclick=()=&gt;{if(confirm(&#x27;Delete this entry?&#x27;)){entries=entries.filter(x=&gt;x.id!==id);save();closeM();renderLog()}};
  document.getElementById(&#x27;eSave&#x27;).onclick=()=&gt;{
    const mt=document.getElementById(&#x27;eM&#x27;).value.trim(),co=document.getElementById(&#x27;eC&#x27;).value.trim(),n=parseFloat(document.getElementById(&#x27;eN&#x27;).value)||0,L=parseFloat(document.getElementById(&#x27;eL&#x27;).value)||0;
    if(!mt||!co||n&lt;=0||L&lt;=0){alert(&#x27;Fill material, colour, rolls and length.&#x27;);return}
    const cv=document.getElementById(&#x27;eCut&#x27;).value.trim();if(document.getElementById(&#x27;eT&#x27;).value===&#x27;issued&#x27;&amp;&amp;cv!==&#x27;&#x27;&amp;&amp;+cv&gt;=0)e.rollsUsed=+cv;else delete e.rollsUsed;
    Object.assign(e,{type:document.getElementById(&#x27;eT&#x27;).value,date:document.getElementById(&#x27;eD&#x27;).value||e.date,material:mt,color:co,count:n,length:L,total:n*L,note:document.getElementById(&#x27;eR&#x27;).value.trim()});
    save();addToList(materials,mt);addToList(colors,co);refreshDatalists();closeM();renderLog();try{renderBalance()}catch(_e){}};
}

// ---- insights ----
function renderInsights(){
  const S=stats(),mo=today().slice(0,7),d60=Date.now()-60*864e5;
  const totM=S.reduce((a,r)=&gt;a+r.bal,0),totR=S.reduce((a,r)=&gt;a+r.balR,0),low=S.filter(r=&gt;r.low),soon=S.filter(r=&gt;r.soon&amp;&amp;!r.low);
  const mr=entries.filter(e=&gt;e.type===&#x27;received&#x27;&amp;&amp;e.date.startsWith(mo)).reduce((a,e)=&gt;a+e.total,0),mi=entries.filter(e=&gt;e.type===&#x27;issued&#x27;&amp;&amp;e.date.startsWith(mo)).reduce((a,e)=&gt;a+e.total,0);
  const byMat={};S.forEach(r=&gt;byMat[r.material]=(byMat[r.material]||0)+r.bal);
  const bars=(o,unit)=&gt;{const e=Object.entries(o).filter(x=&gt;x[1]&gt;0).sort((a,b)=&gt;b[1]-a[1]);if(!e.length)return &#x27;&lt;div class=&quot;empty&quot; style=&quot;padding:8px 0&quot;&gt;Nothing yet.&lt;/div&gt;&#x27;;const mx=e[0][1];
    return e.map(([n,v])=&gt;&#x27;&lt;div class=&quot;hb&quot;&gt;&lt;span class=&quot;n&quot;&gt;&#x27;+escapeHtml(n)+&#x27;&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;div class=&quot;f&quot; style=&quot;width:&#x27;+Math.max(3,v/mx*100)+&#x27;%&quot;&gt;&lt;/div&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;&#x27;+fmN(v)+&#x27; &#x27;+unit+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)};
  const fast={};S.filter(r=&gt;r.i30&gt;0).forEach(r=&gt;fast[r.material+&#x27; · &#x27;+r.color]=r.i30);
  const dead=S.filter(r=&gt;r.bal&gt;0.5&amp;&amp;r.last&amp;&amp;new Date(r.last+&#x27;T00:00&#x27;).getTime()&lt;d60);
  const li=(r,x)=&gt;&#x27;&lt;div class=&quot;mrow&quot;&gt;&lt;div&gt;&lt;b&gt;&#x27;+escapeHtml(r.color)+&#x27;&lt;/b&gt;&lt;span class=&quot;mt&quot;&gt;&#x27;+escapeHtml(r.material)+&#x27;&lt;/span&gt;&lt;div class=&quot;s2&quot;&gt;&#x27;+x+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mres &#x27;+(r.neg?&#x27;bad&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+fmN(r.bal)+&#x27; m&lt;/div&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;insBody&#x27;).innerHTML=
   &#x27;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Total stock&lt;/small&gt;&lt;b&gt;&#x27;+fmN(totM)+&#x27; m&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Rolls in stock&lt;/small&gt;&lt;b&gt;&#x27;+fmN(totR)+&#x27;&lt;/b&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;kpi ok&quot;&gt;&lt;small&gt;Received this month&lt;/small&gt;&lt;b&gt;&#x27;+fmN(mr)+&#x27; m&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Issued this month&lt;/small&gt;&lt;b&gt;&#x27;+fmN(mi)+&#x27; m&lt;/b&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Items tracked&lt;/small&gt;&lt;b&gt;&#x27;+S.length+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi &#x27;+(low.length?&#x27;bad&#x27;:&#x27;ok&#x27;)+&#x27;&quot;&gt;&lt;small&gt;Low / negative&lt;/small&gt;&lt;b&gt;&#x27;+low.length+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;mh&quot;&gt;⚠ Needs attention&lt;/div&gt;&#x27;+(low.length||soon.length?low.map(r=&gt;li(r,r.neg?&#x27;Stock is negative — check entries&#x27;:&#x27;At or below minimum &#x27;+fmN(r.min)+&#x27; m&#x27;)).join(&#x27;&#x27;)+soon.map(r=&gt;li(r,&#x27;Running out in about &#x27;+Math.max(1,Math.round(r.days))+&#x27; day(s) at current use&#x27;)).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;empty&quot; style=&quot;padding:8px 0&quot;&gt;All items look healthy ✓&lt;/div&gt;&#x27;)+&#x27;&lt;div class=&quot;s2&quot;&gt;Set a minimum level by tapping an item in Balance.&lt;/div&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;mh&quot;&gt;📦 Stock by material&lt;/div&gt;&#x27;+bars(byMat,&#x27;m&#x27;)+&#x27;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;mh&quot;&gt;🔥 Fast movers (issued, last 30 days)&lt;/div&gt;&#x27;+bars(fast,&#x27;m&#x27;)+&#x27;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;mh&quot;&gt;🕸 Slow / dead stock&lt;/div&gt;&#x27;+(dead.length?dead.map(r=&gt;li(r,&#x27;Last movement &#x27;+fmD(r.last))).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;empty&quot; style=&quot;padding:8px 0&quot;&gt;No stock idle for 60+ days.&lt;/div&gt;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
}

refreshDatalists();
updateTotal();

<script>
