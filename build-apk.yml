name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Install dependencies
        run: |
          npm install
          npm ls @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          IM=convert; command -v convert >/dev/null || IM="magick"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM icon-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintingRegister-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
